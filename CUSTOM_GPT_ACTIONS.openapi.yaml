openapi: 3.1.0
info:
  title: Elementize Custom GPT Actions
  version: 0.5.13.0
  description: Controlled WordPress, Elementor, Pixfort, media-library, visual, layout, lifecycle, and page-owned embedded Pixfort copy actions for Elementize.
servers:
  - url: https://permitted-tucson-invention-principles.trycloudflare.com
    description: Current Cloudflare quick tunnel. Replace if the quick tunnel changes.

paths:
  /wp-json/elementize/v1/status:
    get:
      operationId: getElementizeStatus
      summary: Get Elementize status and capabilities
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/media/images:
    get:
      operationId: searchElementizeMediaImages
      summary: Search WordPress Media Library images
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: filename, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pixfort/templates:
    get:
      operationId: searchPixfortPlannerCandidates
      summary: Search Pixfort template candidates
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, enum: [section, page], default: section } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pixfort/visual-probe:
    post:
      operationId: getPixfortVisualProbe
      summary: Retrieve visual proof for up to four Pixfort templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_ids]
              properties:
                template_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/create:
    post:
      operationId: createElementorDraft
      summary: Create a new Elementize-managed Elementor draft
      description: Creates a draft only and never publishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string }
                slug: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '201': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/pixfort/insert:
    post:
      operationId: insertPixfortTemplate
      summary: Insert a Pixfort template into an Elementor page
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, template_id]
              properties:
                content_hash: { type: string }
                template_id: { type: string }
                position: { type: string, enum: [start, end, before, after], default: end }
                target_element_id: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/text:
    get:
      operationId: getElementorPageText
      summary: Read editable main-page Elementor copy and current content hash
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
    post:
      operationId: updateElementorPageText
      summary: Update recognized main-page Elementor copy with stale-value protection
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [element_id, setting_path, value]
                    properties:
                      element_id: { type: string }
                      setting_path: { $ref: '#/components/schemas/SettingPath' }
                      expected_value: { type: string }
                      value: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/embedded-documents:
    get:
      operationId: getElementizeEmbeddedDocuments
      summary: Audit Pixfort child documents referenced by a page
      description: Read-only. Use before any embedded Pixfort copy write. Original Pixfort templates must never be edited directly.
      parameters:
        - $ref: '#/components/parameters/PageId'
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/embedded-documents/clone-relink:
    post:
      operationId: cloneRelinkElementizeEmbeddedDocuments
      summary: Clone referenced Pixfort templates and relink only this managed draft page
      description: Guarded isolation step. Never modifies the original Pixfort templates.
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, content_hash, expected_documents, confirm_clone_and_relink]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                content_hash: { type: string }
                expected_documents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [post_id, elementor_data_hash]
                    properties:
                      post_id: { type: integer, minimum: 1 }
                      elementor_data_hash: { type: string }
                      post_status: { type: string }
                      post_title: { type: string }
                confirm_clone_and_relink: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/embedded-text:
    get:
      operationId: getElementizeEmbeddedText
      summary: Read copy fields from Pixfort child documents referenced by a page
      description: Check prepare_required, elementize_managed_clone, owner_page_id, document_writable, and fresh document hashes before writing.
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
    post:
      operationId: updateElementizeEmbeddedText
      summary: Update copy only inside Elementize-owned Pixfort clones
      description: Direct writes to original Pixfort templates are blocked. Use only fresh page/document hashes and expected values.
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, page_content_hash, updates, confirm_embedded_text_write]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                page_content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [document_id, document_hash, element_id, setting_path, expected_value, value]
                    properties:
                      document_id: { type: integer, minimum: 1 }
                      document_hash: { type: string }
                      element_id: { type: string }
                      setting_path: { $ref: '#/components/schemas/SettingPath' }
                      expected_value: { type: string }
                      value: { type: string }
                confirm_embedded_text_write: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/visual-settings:
    get:
      operationId: getElementorVisualSettings
      summary: Read compact filtered Elementor visual settings
      parameters:
        - $ref: '#/components/parameters/PageId'
        - { name: kind, in: query, required: false, schema: { type: string, enum: [all, color, icon, media, global, dynamic] } }
        - { name: active, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: writable, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: compact, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: element_id, in: query, required: false, schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
    post:
      operationId: updateElementorVisualSettings
      summary: Guardedly update active colors, Pixfort icons, or image attachments
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, element_id, setting_path]
                    properties:
                      kind: { type: string, enum: [color, icon, media] }
                      element_id: { type: string }
                      setting_path: { $ref: '#/components/schemas/SettingPath' }
                      expected_value: { type: string }
                      value: { type: string }
                      expected_attachment_id: { type: integer, minimum: 1 }
                      attachment_id: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/layout:
    get:
      operationId: getElementizePageLayout
      summary: Read current guarded page layout mode
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
    post:
      operationId: updateElementizePageLayout
      summary: Change a managed draft between site and standalone layout
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, expected_mode, layout_token, content_hash, mode, confirm_layout_change]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                expected_mode: { type: string, enum: [default, site, standalone] }
                layout_token: { type: string }
                content_hash: { type: string }
                mode: { type: string, enum: [site, standalone] }
                confirm_layout_change: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/lifecycle:
    get:
      operationId: getElementizePageLifecycle
      summary: Read guarded lifecycle state for a WordPress page
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/trash:
    post:
      operationId: trashElementizeManagedPage
      summary: Move a managed draft page to WordPress Trash
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_trash]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_trash: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/restore:
    post:
      operationId: restoreElementizeManagedPage
      summary: Restore a managed page from Trash to draft
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, confirm_restore]
              properties:
                expected_status: { type: string, enum: [trash] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                confirm_restore: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/publish:
    post:
      operationId: publishElementizeManagedPage
      summary: Publish a non-empty managed Elementor draft
      description: High impact. Use only when explicitly requested after a fresh lifecycle read.
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_publish]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_publish: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

  /wp-json/elementize/v1/pages/{id}/unpublish:
    post:
      operationId: unpublishElementizeManagedPage
      summary: Return a published managed page to draft
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_unpublish]
              properties:
                expected_status: { type: string, enum: [publish] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_unpublish: { type: boolean, enum: [true] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/ObjectResponse' }

components:
  parameters:
    PageId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    SettingPath:
      type: array
      minItems: 1
      items:
        anyOf:
          - { type: string }
          - { type: integer }
  responses:
    ObjectResponse:
      description: Elementize response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
