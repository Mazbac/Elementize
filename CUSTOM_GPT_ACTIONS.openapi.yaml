openapi: 3.1.0
info:
  title: Elementize Custom GPT Actions
  version: 0.4.2.0
  description: Controlled WordPress, Elementor, Pixfort, visual editing, and guarded page lifecycle actions for Elementize.
servers:
  - url: https://permitted-tucson-invention-principles.trycloudflare.com
    description: Current Cloudflare quick tunnel. Replace if the quick tunnel changes.
paths:
  /wp-json/elementize/v1/status:
    get:
      operationId: getElementizeStatus
      summary: Get Elementize status and capabilities
      responses:
        '200':
          description: Elementize status
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementize_version: { type: string }
                  visual_settings_write_types:
                    type: array
                    items: { type: string }
                  visual_color_active_state: { type: boolean }
                  visual_css_regeneration: { type: string }
                  visual_settings_filters:
                    type: array
                    items: { type: string }
                  visual_settings_filter_max_limit: { type: integer }
                  visual_settings_compact_default_limit: { type: integer }
                  lifecycle_management: { type: boolean }
                  lifecycle_managed_pages_only: { type: boolean }
                  lifecycle_actions:
                    type: array
                    items: { type: string }
                  hard_delete_available: { type: boolean }
                additionalProperties: true

  /wp-json/elementize/v1/pixfort/templates:
    get:
      operationId: searchPixfortPlannerCandidates
      summary: Search Pixfort template candidates
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [section, page], default: section }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Pixfort catalogue results
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        thumbnail: { type: [string, 'null'] }
                        identity_hash: { type: string }
                      additionalProperties: true
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                additionalProperties: true

  /wp-json/elementize/v1/pixfort/visual-probe:
    post:
      operationId: getPixfortVisualProbe
      summary: Retrieve visual proof for up to four Pixfort templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_ids]
              properties:
                template_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string }
      responses:
        '200':
          description: Pixfort visual proof
          content:
            application/json:
              schema:
                type: object
                properties:
                  probe_count: { type: integer }
                  mapping:
                    type: array
                    items:
                      type: object
                      properties:
                        template_id: { type: string }
                        identity_hash: { type: string }
                      additionalProperties: true
                  openaiFileResponse:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        mime_type: { type: string }
                        content: { type: string }
                      additionalProperties: true
                additionalProperties: true

  /wp-json/elementize/v1/pages/create:
    post:
      operationId: createElementorDraft
      summary: Create a new Elementize-managed Elementor draft
      description: Creates a draft only. Successful new drafts are marked Elementize-managed. This action never publishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string }
                slug:
                  type: string
                  description: Optional. Omit to let WordPress determine the slug.
      responses:
        '200':
          description: Created managed Elementor draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean }
                  page:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      status: { type: string }
                      slug: { type: string }
                      permalink: { type: string }
                      preview_url: { type: string }
                      edit_url: { type: string }
                    additionalProperties: true
                  is_elementor: { type: boolean }
                  top_level_count: { type: integer }
                  content_hash: { type: string }
                  elementize_managed: { type: boolean }
                  lifecycle:
                    type: object
                    properties:
                      lifecycle_token: { type: string }
                      allowed_actions:
                        type: array
                        items: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '201':
          description: Created managed Elementor draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean }
                  content_hash: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/pixfort/insert:
    post:
      operationId: insertPixfortTemplate
      summary: Insert a Pixfort template into an Elementor page
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, template_id]
              properties:
                content_hash: { type: string }
                template_id: { type: string }
                position: { type: string, enum: [start, end, before, after], default: end }
                target_element_id:
                  type: string
                  description: Required for before or after positioning.
      responses:
        '200':
          description: Pixfort insertion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  inserted_top_level_count: { type: integer }
                  inserted_top_level_ids:
                    type: array
                    items: { type: string }
                  content_hash: { type: string }
                  revision_id: { type: integer }
                  edit_url: { type: string }
                  permalink: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/text:
    get:
      operationId: getElementorPageText
      summary: Read editable Elementor text and current content hash
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Editable Elementor text
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_hash: { type: string }
                  text_items:
                    type: array
                    items:
                      type: object
                      properties:
                        element_id: { type: string }
                        setting_path:
                          type: array
                          items:
                            anyOf: [{ type: string }, { type: integer }]
                        value: { type: string }
                      additionalProperties: true
                additionalProperties: true
    post:
      operationId: updateElementorPageText
      summary: Update recognized Elementor copy with stale-value protection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [element_id, setting_path, value]
                    properties:
                      element_id: { type: string }
                      setting_path:
                        type: array
                        minItems: 1
                        items:
                          anyOf: [{ type: string }, { type: integer }]
                      expected_value: { type: string }
                      value: { type: string }
      responses:
        '200':
          description: Text update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  updated_count: { type: integer }
                  revision_id: { type: integer }
                  content_hash: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/visual-settings:
    get:
      operationId: getElementorVisualSettings
      summary: Read compact filtered Elementor visual settings
      description: For normal editing use compact=true, active=true, writable=true, and limit=20. Paginate with next_offset when needed. Add kind to target only colors, icons, or media.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: kind
          in: query
          required: false
          description: Optional visual kind filter.
          schema: { type: string, enum: [all, color, icon, media, global, dynamic] }
        - name: active
          in: query
          required: false
          description: Use true for safe editing reads.
          schema: { type: boolean, default: true }
        - name: writable
          in: query
          required: false
          description: Use true for safe editing reads.
          schema: { type: boolean, default: true }
        - name: compact
          in: query
          required: false
          description: Use true for Custom GPT reads to minimize response size.
          schema: { type: boolean, default: true }
        - name: element_id
          in: query
          required: false
          schema: { type: string }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          description: Use 20 for compact Custom GPT reads. Maximum 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Compact filtered visual settings inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_hash: { type: string }
                  visual_item_total: { type: integer }
                  visual_item_matched: { type: integer }
                  visual_item_count: { type: integer }
                  visual_items_truncated: { type: boolean }
                  next_offset: { type: [integer, 'null'] }
                  returned_kind_counts:
                    type: object
                    properties:
                      color: { type: integer }
                      icon: { type: integer }
                      media: { type: integer }
                      global: { type: integer }
                      dynamic: { type: integer }
                    additionalProperties: true
                  visual_filters:
                    type: object
                    properties:
                      kind: { type: [string, 'null'] }
                      active: { type: [boolean, 'null'] }
                      writable: { type: [boolean, 'null'] }
                      compact: { type: [boolean, 'null'] }
                      element_id: { type: [string, 'null'] }
                      offset: { type: integer }
                      limit: { type: [integer, 'null'] }
                    additionalProperties: true
                  visual_items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        element_id: { type: string }
                        widget_type: { type: [string, 'null'] }
                        setting_path:
                          type: array
                          items:
                            anyOf: [{ type: string }, { type: integer }]
                        value:
                          anyOf:
                            - type: string
                            - type: object
                              properties:
                                id:
                                  anyOf: [{ type: integer }, { type: string }]
                                file: { type: string }
                                source: { type: string }
                              additionalProperties: true
                        active: { type: boolean }
                        writable: { type: boolean }
                      additionalProperties: true
                additionalProperties: true
    post:
      operationId: updateElementorVisualSettings
      summary: Guardedly update active colors, Pixfort icons, or image attachments
      description: Read visual settings immediately before writing. Use the fresh content_hash and exact expected values or attachment IDs from writable targets.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, element_id, setting_path]
                    properties:
                      kind: { type: string, enum: [color, icon, media] }
                      element_id: { type: string }
                      setting_path:
                        type: array
                        minItems: 1
                        items:
                          anyOf: [{ type: string }, { type: integer }]
                      expected_value: { type: string }
                      value: { type: string }
                      expected_attachment_id: { type: integer, minimum: 1 }
                      attachment_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Visual update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  updated_count: { type: integer }
                  revision_id: { type: integer }
                  content_hash: { type: string }
                  css_regenerated: { type: boolean }
                  css_regeneration_error: { type: string }
                additionalProperties: true
        '409':
          description: Page or target changed after the fresh read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      status: { type: integer }
                      content_hash: { type: string }
                    additionalProperties: true
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/lifecycle:
    get:
      operationId: getElementizePageLifecycle
      summary: Read guarded lifecycle state for a WordPress page
      description: Call immediately before trash, restore, publish, or unpublish. Use returned title, status, lifecycle_token, content_hash, and allowed_actions without guessing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Current page lifecycle snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_id: { type: integer }
                  exists: { type: boolean }
                  title: { type: string }
                  status: { type: string }
                  elementize_managed: { type: boolean }
                  managed_version: { type: string }
                  lifecycle_token: { type: string }
                  content_hash: { type: string }
                  is_elementor: { type: boolean }
                  top_level_count: { type: integer }
                  preview_url: { type: [string, 'null'] }
                  permalink: { type: [string, 'null'] }
                  allowed_actions:
                    type: array
                    items: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/trash:
    post:
      operationId: trashElementizeManagedPage
      summary: Move a managed draft page to WordPress Trash
      description: Reversible and never a hard delete. Use only after a fresh lifecycle read confirms managed draft state and allows trash.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_trash]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_trash: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page moved to Trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  trashed: { type: boolean }
                  page_id: { type: integer }
                  previous_status: { type: string }
                  status: { type: string }
                  hard_deleted: { type: boolean }
                  restore_available: { type: boolean }
                  lifecycle:
                    type: object
                    properties:
                      lifecycle_token: { type: string }
                      content_hash: { type: string }
                      allowed_actions:
                        type: array
                        items: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '409':
          description: Lifecycle or content changed after the fresh read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/restore:
    post:
      operationId: restoreElementizeManagedPage
      summary: Restore a managed page from Trash to draft
      description: Use only after a fresh lifecycle read confirms managed trash state and allows restore.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, confirm_restore]
              properties:
                expected_status: { type: string, enum: [trash] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                confirm_restore: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page restored to draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
                  page_id: { type: integer }
                  previous_status: { type: string }
                  status: { type: string }
                  lifecycle:
                    type: object
                    properties:
                      lifecycle_token: { type: string }
                      content_hash: { type: string }
                      allowed_actions:
                        type: array
                        items: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '409':
          description: Lifecycle changed after the fresh read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/publish:
    post:
      operationId: publishElementizeManagedPage
      summary: Publish a non-empty managed Elementor draft
      description: High impact. Use only when explicitly requested and a fresh lifecycle read confirms managed draft state, non-empty content, and publish permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_publish]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_publish: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page published
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  page_id: { type: integer }
                  previous_status: { type: string }
                  status: { type: string }
                  revision_id: { type: [integer, 'null'] }
                  permalink: { type: string }
                  lifecycle:
                    type: object
                    properties:
                      lifecycle_token: { type: string }
                      content_hash: { type: string }
                      allowed_actions:
                        type: array
                        items: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '400':
          description: Publication refused, including empty-page protection
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                additionalProperties: true
        '409':
          description: Lifecycle or content changed after the fresh read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/unpublish:
    post:
      operationId: unpublishElementizeManagedPage
      summary: Return a published managed page to draft
      description: Use only when explicitly requested and a fresh lifecycle read confirms managed published state and unpublish permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_unpublish]
              properties:
                expected_status: { type: string, enum: [publish] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_unpublish: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page returned to draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  unpublished: { type: boolean }
                  page_id: { type: integer }
                  previous_status: { type: string }
                  status: { type: string }
                  revision_id: { type: [integer, 'null'] }
                  preview_url: { type: string }
                  lifecycle:
                    type: object
                    properties:
                      lifecycle_token: { type: string }
                      content_hash: { type: string }
                      allowed_actions:
                        type: array
                        items: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '409':
          description: Lifecycle or content changed after the fresh read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                additionalProperties: true
