openapi: 3.1.0
info:
  title: Elementize Custom GPT Actions
  version: 0.5.0.2
  description: Controlled WordPress, Elementor, Pixfort, visual editing, page layout, and guarded lifecycle actions for Elementize.
servers:
  - url: https://permitted-tucson-invention-principles.trycloudflare.com
    description: Current Cloudflare quick tunnel. Replace if the quick tunnel changes.

paths:
  /wp-json/elementize/v1/status:
    get:
      operationId: getElementizeStatus
      summary: Get Elementize status and capabilities
      responses:
        '200':
          description: Elementize status
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementize_version: { type: string }
                  lifecycle_management: { type: boolean }
                  page_layout_management: { type: boolean }
                  hard_delete_available: { type: boolean }
                additionalProperties: true

  /wp-json/elementize/v1/pixfort/templates:
    get:
      operationId: searchPixfortPlannerCandidates
      summary: Search Pixfort template candidates
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [section, page], default: section }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Pixfort catalogue results
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        thumbnail: { type: string }
                        identity_hash: { type: string }
                      additionalProperties: true
                additionalProperties: true

  /wp-json/elementize/v1/pixfort/visual-probe:
    post:
      operationId: getPixfortVisualProbe
      summary: Retrieve visual proof for up to four Pixfort templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_ids]
              properties:
                template_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string }
      responses:
        '200':
          description: Pixfort visual proof
          content:
            application/json:
              schema:
                type: object
                properties:
                  probe_count: { type: integer }
                  mapping:
                    type: array
                    items:
                      type: object
                      properties:
                        template_id: { type: string }
                        identity_hash: { type: string }
                      additionalProperties: true
                  openaiFileResponse:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        mime_type: { type: string }
                        content: { type: string }
                      additionalProperties: true
                additionalProperties: true

  /wp-json/elementize/v1/pages/create:
    post:
      operationId: createElementorDraft
      summary: Create a new Elementize-managed Elementor draft
      description: Creates a draft only and never publishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string }
                slug: { type: string }
      responses:
        '200':
          description: Draft creation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean }
                  content_hash: { type: string }
                  elementize_managed: { type: boolean }
                  page:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      status: { type: string }
                      preview_url: { type: string }
                    additionalProperties: true
                additionalProperties: true
        '201':
          description: Draft creation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean }
                  content_hash: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/pixfort/insert:
    post:
      operationId: insertPixfortTemplate
      summary: Insert a Pixfort template into an Elementor page
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, template_id]
              properties:
                content_hash: { type: string }
                template_id: { type: string }
                position: { type: string, enum: [start, end, before, after], default: end }
                target_element_id: { type: string }
      responses:
        '200':
          description: Pixfort insertion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  inserted_top_level_count: { type: integer }
                  inserted_top_level_ids:
                    type: array
                    items: { type: string }
                  content_hash: { type: string }
                  revision_id: { type: integer }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/text:
    get:
      operationId: getElementorPageText
      summary: Read editable Elementor text and current content hash
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Editable Elementor text
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_hash: { type: string }
                  text_items:
                    type: array
                    items:
                      type: object
                      properties:
                        element_id: { type: string }
                        setting_path:
                          type: array
                          items:
                            anyOf:
                              - { type: string }
                              - { type: integer }
                        value: { type: string }
                      additionalProperties: true
                additionalProperties: true
    post:
      operationId: updateElementorPageText
      summary: Update recognized Elementor copy with stale-value protection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [element_id, setting_path, value]
                    properties:
                      element_id: { type: string }
                      setting_path:
                        type: array
                        minItems: 1
                        items:
                          anyOf:
                            - { type: string }
                            - { type: integer }
                      expected_value: { type: string }
                      value: { type: string }
      responses:
        '200':
          description: Text update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  updated_count: { type: integer }
                  revision_id: { type: integer }
                  content_hash: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/visual-settings:
    get:
      operationId: getElementorVisualSettings
      summary: Read compact filtered Elementor visual settings
      description: Use compact=true, active=true, writable=true, and limit=20. Paginate with next_offset.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, color, icon, media, global, dynamic] }
        - name: active
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: writable
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: compact
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: element_id
          in: query
          required: false
          schema: { type: string }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Compact visual settings result
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_hash: { type: string }
                  visual_item_total: { type: integer }
                  visual_item_matched: { type: integer }
                  visual_item_count: { type: integer }
                  visual_items_truncated: { type: boolean }
                  next_offset: { type: integer }
                  returned_kind_counts:
                    type: object
                    properties:
                      color: { type: integer }
                      icon: { type: integer }
                      media: { type: integer }
                    additionalProperties: true
                  visual_items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        element_id: { type: string }
                        widget_type: { type: string }
                        setting_path:
                          type: array
                          items:
                            anyOf:
                              - { type: string }
                              - { type: integer }
                        value:
                          anyOf:
                            - { type: string }
                            - type: object
                              properties:
                                id: { type: integer }
                                file: { type: string }
                                source: { type: string }
                              additionalProperties: true
                        active: { type: boolean }
                        writable: { type: boolean }
                      additionalProperties: true
                additionalProperties: true
    post:
      operationId: updateElementorVisualSettings
      summary: Guardedly update active colors, Pixfort icons, or image attachments
      description: Read visual settings immediately before writing and use the fresh content hash.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, updates]
              properties:
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, element_id, setting_path]
                    properties:
                      kind: { type: string, enum: [color, icon, media] }
                      element_id: { type: string }
                      setting_path:
                        type: array
                        minItems: 1
                        items:
                          anyOf:
                            - { type: string }
                            - { type: integer }
                      expected_value: { type: string }
                      value: { type: string }
                      expected_attachment_id: { type: integer, minimum: 1 }
                      attachment_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Visual update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  page_id: { type: integer }
                  updated_count: { type: integer }
                  revision_id: { type: integer }
                  content_hash: { type: string }
                  css_regenerated: { type: boolean }
                additionalProperties: true
        '409':
          description: Page or visual target changed after the fresh read

  /wp-json/elementize/v1/pages/{id}/layout:
    get:
      operationId: getElementizePageLayout
      summary: Read current guarded page layout mode
      description: Site keeps theme chrome. Standalone uses Elementor Canvas with no theme header or footer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Current page layout state
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_id: { type: integer }
                  title: { type: string }
                  status: { type: string }
                  elementize_managed: { type: boolean }
                  mode: { type: string }
                  elementor_template: { type: string }
                  layout_token: { type: string }
                  content_hash: { type: string }
                  preview_url: { type: string }
                additionalProperties: true
    post:
      operationId: updateElementizePageLayout
      summary: Change a managed draft between site and standalone layout
      description: Read layout immediately first and use its fresh state values.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, expected_mode, layout_token, content_hash, mode, confirm_layout_change]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                expected_mode: { type: string, enum: [default, site, standalone] }
                layout_token: { type: string }
                content_hash: { type: string }
                mode: { type: string, enum: [site, standalone] }
                confirm_layout_change: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page layout update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  changed: { type: boolean }
                  page_id: { type: integer }
                  previous_mode: { type: string }
                  mode: { type: string }
                  elementor_template: { type: string }
                  revision_id: { type: integer }
                  content_hash: { type: string }
                  layout_token: { type: string }
                  preview_url: { type: string }
                additionalProperties: true
        '409':
          description: Page layout or content changed after the fresh read

  /wp-json/elementize/v1/pages/{id}/lifecycle:
    get:
      operationId: getElementizePageLifecycle
      summary: Read guarded lifecycle state for a WordPress page
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Current page lifecycle snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_id: { type: integer }
                  exists: { type: boolean }
                  title: { type: string }
                  status: { type: string }
                  elementize_managed: { type: boolean }
                  managed_version: { type: string }
                  lifecycle_token: { type: string }
                  content_hash: { type: string }
                  is_elementor: { type: boolean }
                  top_level_count: { type: integer }
                  preview_url: { type: string }
                  permalink: { type: string }
                  allowed_actions:
                    type: array
                    items: { type: string }
                additionalProperties: true

  /wp-json/elementize/v1/pages/{id}/trash:
    post:
      operationId: trashElementizeManagedPage
      summary: Move a managed draft page to WordPress Trash
      description: Reversible and never a hard delete. Read lifecycle first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_trash]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_trash: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page moved to Trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  trashed: { type: boolean }
                  page_id: { type: integer }
                  status: { type: string }
                  hard_deleted: { type: boolean }
                  restore_available: { type: boolean }
                additionalProperties: true
        '409':
          description: Lifecycle or content changed after the fresh read

  /wp-json/elementize/v1/pages/{id}/restore:
    post:
      operationId: restoreElementizeManagedPage
      summary: Restore a managed page from Trash to draft
      description: Read lifecycle first and use the fresh lifecycle token.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, confirm_restore]
              properties:
                expected_status: { type: string, enum: [trash] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                confirm_restore: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page restored to draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
                  page_id: { type: integer }
                  status: { type: string }
                additionalProperties: true
        '409':
          description: Lifecycle changed after the fresh read

  /wp-json/elementize/v1/pages/{id}/publish:
    post:
      operationId: publishElementizeManagedPage
      summary: Publish a non-empty managed Elementor draft
      description: High impact. Use only when explicitly requested and after a fresh lifecycle read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_publish]
              properties:
                expected_status: { type: string, enum: [draft] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_publish: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page published
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  page_id: { type: integer }
                  status: { type: string }
                  revision_id: { type: integer }
                  permalink: { type: string }
                additionalProperties: true
        '400':
          description: Publication refused
        '409':
          description: Lifecycle or content changed after the fresh read

  /wp-json/elementize/v1/pages/{id}/unpublish:
    post:
      operationId: unpublishElementizeManagedPage
      summary: Return a published managed page to draft
      description: Use only when explicitly requested and after a fresh lifecycle read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, lifecycle_token, content_hash, confirm_unpublish]
              properties:
                expected_status: { type: string, enum: [publish] }
                expected_title: { type: string }
                lifecycle_token: { type: string }
                content_hash: { type: string }
                confirm_unpublish: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Page returned to draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  unpublished: { type: boolean }
                  page_id: { type: integer }
                  status: { type: string }
                  revision_id: { type: integer }
                  preview_url: { type: string }
                additionalProperties: true
        '409':
          description: Lifecycle or content changed after the fresh read
