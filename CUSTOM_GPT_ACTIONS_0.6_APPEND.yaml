  /wp-json/elementize/v1/pages/{id}/state:
    get:
      operationId: getElementizePageState
      summary: Read page layout and lifecycle state together
      description: Read before any layout, publish, unpublish, trash, or restore change. Returns fresh layout/lifecycle guards and content hashes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Combined page layout and lifecycle state }
    post:
      operationId: updateElementizePageState
      summary: Guardedly change page layout or lifecycle state
      description: One compact mutation action for set_layout, trash, restore, publish, or unpublish. Requires fresh guards from getElementizePageState and explicit confirmation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expected_status, expected_title, confirm_state_change]
              properties:
                action: { type: string, enum: [set_layout, trash, restore, publish, unpublish] }
                expected_status: { type: string }
                expected_title: { type: string }
                content_hash: { type: string }
                lifecycle_token: { type: string }
                expected_mode: { type: string, enum: [default, site, standalone] }
                layout_token: { type: string }
                mode: { type: string, enum: [site, standalone] }
                confirm_state_change: { type: boolean, enum: [true] }
      responses:
        '200': { description: Guarded state-change result }
        '400': { description: Missing action-specific guard or confirmation }
        '409': { description: Page state, layout, title, status, or content changed after the fresh read }

  /wp-json/elementize/v1/pages/{id}/elements/remove:
    post:
      operationId: removeElementizeTopLevelSection
      summary: Remove one top-level Elementor section or container
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_hash, element_id]
              properties:
                content_hash: { type: string }
                element_id: { type: string }
      responses:
        '200': { description: Top-level section removal result }
        '409': { description: Page content or target changed after the fresh read }

  /wp-json/elementize/v1/pages/{id}/links:
    get:
      operationId: getElementizePageLinks
      summary: Read recognized main-page Elementor link destinations
      description: Use for CTA and link verification. Dynamic link values are read-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Recognized page links and fresh content hash }
    post:
      operationId: updateElementizePageLinks
      summary: Guardedly update recognized main-page Elementor link destinations
      description: Use only fresh page identity, content hash, exact setting paths, and expected values.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, content_hash, updates, confirm_link_write]
              properties:
                expected_status: { type: string }
                expected_title: { type: string }
                content_hash: { type: string }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [element_id, setting_path, expected_value, value]
                    properties:
                      element_id: { type: string }
                      setting_path:
                        type: array
                        minItems: 1
                        items:
                          anyOf:
                            - { type: string }
                            - { type: integer }
                      expected_value: { type: string }
                      value: { type: string }
                confirm_link_write: { type: boolean, enum: [true] }
      responses:
        '200': { description: Guarded link update result }
        '400': { description: Invalid or unsupported destination }
        '409': { description: Page identity, content, or expected link value changed }

  /wp-json/elementize/v1/pages/{id}/completion-audit:
    get:
      operationId: getElementizePageCompletionAudit
      summary: Run content, technical, link, proof, and design completion audits together
      description: Read-only compact GPT-facing completion gate. Preserves the full underlying quality and calibrated design-audit payloads; rendered visual inspection is still required.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Combined quality and design audits with default completion summary }

  /wp-json/elementize/v1/pages/{id}/design-settings:
    get:
      operationId: getElementizePageDesignSettings
      summary: Discover real Elementor and Pixfort design controls on a page
      description: Read-only. Use before broader design editing to inspect exact style-setting paths, explicit/global/dynamic sources, responsive scopes, and future writer candidates.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [typography, spacing, alignment, sizing, border_radius, border, shadow, background, color] } }
        - { name: element_id, in: query, required: false, schema: { type: string } }
        - { name: top_level_id, in: query, required: false, schema: { type: string } }
        - { name: responsive_scope, in: query, required: false, schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
      responses:
        '200': { description: Read-only discovered design controls with exact paths, values, sources, responsive scopes, and writer-candidate hints }

  /wp-json/elementize/v1/pixfort/catalogue-summary:
    get:
      operationId: getElementizePixfortCatalogueSummary
      summary: Summarize the available Pixfort catalogue and Design Intelligence reuse signals
      description: Read before substantial new-page template selection to understand catalogue breadth, template families, recent reuse, and recent visual inspections.
      responses:
        '200': { description: Catalogue totals, categories, subtypes, template-family counts, reuse history, and inspection history }

  /wp-json/elementize/v1/pages/{id}/pixfort/template-structure:
    post:
      operationId: inspectElementizePixfortTemplateStructure
      summary: Inspect the Elementor structure of shortlisted Pixfort templates without inserting them
      description: Read-only. Use after visual shortlisting to compare layout shape, widget mix, density, alignment, imagery, and dependency indicators before choosing important sections.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_ids]
              properties:
                template_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string }
      responses:
        '200': { description: Read-only structural descriptions for shortlisted Pixfort templates }
