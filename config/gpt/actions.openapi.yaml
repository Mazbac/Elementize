openapi: 3.1.0
info:
  title: Elementize Content Actions
  version: 0.31.0
  description: Guarded content editing for existing Elementor and Pixfort pages.
servers:
  - url: https://example.invalid
    description: Replaced automatically by the Elementize setup screen.

paths:
  /wp-json/elementize/v1/status:
    get:
      operationId: getElementizeStatus
      summary: Check Elementize, Elementor, and Pixfort readiness
      responses:
        '200':
          description: Elementize status and supported content-editing scope

  /wp-json/elementize/v1/pages:
    get:
      operationId: listElementizePages
      summary: List editable Elementor pages
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Editable Elementor pages

  /wp-json/elementize/v1/pages/{id}/content:
    get:
      operationId: getElementizePageContent
      summary: Read editable copy, links, images, and Pixfort icons from one Elementor page
      description: Returns exact element IDs, setting paths, current values, page identity, and a fresh content hash. Dynamic/global values and shared template documents are not writable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, text, link, media, pixfort_icon], default: all }
        - name: element_id
          in: query
          required: false
          schema: { type: string }
        - name: top_level_id
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Fresh editable page-content snapshot
    post:
      operationId: updateElementizePageContent
      summary: Guardedly update copy, links, images, or Pixfort icons
      description: Always read the page immediately before writing. Requires the fresh page status/title/hash and exact setting values. Live published pages require a second explicit confirmation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, content_hash, updates, confirm_content_write]
              properties:
                expected_status: { type: string }
                expected_title: { type: string }
                content_hash: { type: string }
                confirm_content_write: { type: boolean, enum: [true] }
                confirm_published_page: { type: boolean, default: false }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, element_id, setting_path]
                    properties:
                      kind: { type: string, enum: [text, link, media, pixfort_icon] }
                      element_id: { type: string, maxLength: 100 }
                      setting_path:
                        type: array
                        minItems: 1
                        maxItems: 30
                        items:
                          anyOf:
                            - { type: string, maxLength: 200 }
                            - { type: integer }
                      expected_value: { type: string }
                      value: { type: string }
                      expected_attachment_id: { type: integer, minimum: 0 }
                      attachment_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Content changes saved and verified in persisted Elementor data
        '400':
          description: Unsupported content field/value or missing confirmation
        '409':
          description: Page, revision capability, or target changed after the fresh read

  /wp-json/elementize/v1/media/images:
    get:
      operationId: searchElementizeMediaImages
      summary: Search WordPress Media Library images
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: filename
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching WordPress image attachments

  /wp-json/elementize/v1/media/images/import-chat-file:
    post:
      operationId: importElementizeConversationImage
      summary: Import one image attached in this ChatGPT conversation
      description: Use only when the user wants an image from the current ChatGPT conversation placed on the WordPress page. Returns a WordPress attachment_id for a later guarded media update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [openaiFileIdRefs, confirm_import]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: Exactly one image from the current ChatGPT conversation. At runtime ChatGPT expands the file reference into file metadata for Elementize.
                  items: { type: string }
                title: { type: string }
                alt: { type: string }
                confirm_import: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Conversation image imported and verified
        '400':
          description: Invalid file, unsupported image, or confirmation missing
