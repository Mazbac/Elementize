openapi: 3.1.0
info:
  title: Elementize Actions
  version: 1.0.0
  description: Direct guarded editing of existing Elementor + Pixfort content. Supports text, local colours, images and verified Pixfort icons only.
  license:
    name: GPL-2.0-or-later
    identifier: GPL-2.0-or-later
security:
  - basicAuth: []
servers:
  - url: https://example.invalid
    description: Replaced automatically by the Elementize setup screen.

paths:
  /wp-json/elementize/v1/status:
    get:
      operationId: getElementizeStatus
      summary: Check Elementize readiness
      responses:
        '200': { description: 'Plugin, Elementor, Pixfort and editing capability status' }
        '401': { description: Authentication required }

  /wp-json/elementize/v1/pages:
    get:
      operationId: listElementizePages
      summary: List editable Elementor pages
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Editable Elementor pages }
        '401': { description: Authentication required }
        '403': { description: Page editing permission required }

  /wp-json/elementize/v1/pages/{id}/content:
    get:
      operationId: getElementizePageContent
      summary: Read directly editable fields on an existing page
      description: Returns exact element IDs, setting paths, current values and a fresh content hash. Only text, colour, media and Pixfort-icon fields are exposed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [all, text, color, media, pixfort_icon], default: all } }
        - { name: element_id, in: query, required: false, schema: { type: string } }
        - { name: top_level_id, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Fresh editable field snapshot }
        '401': { description: Authentication required }
        '403': { description: Page editing permission required }
        '404': { description: Page not found }

    post:
      operationId: updateElementizePageContent
      summary: Update existing text, colours, images or Pixfort icons
      description: Guarded direct edit only. Never creates, inserts, moves, duplicates or deletes Elementor elements.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_status, expected_title, content_hash, updates, confirm_content_write]
              properties:
                expected_status: { type: string }
                expected_title: { type: string }
                content_hash: { type: string }
                confirm_content_write: { type: boolean, enum: [true] }
                confirm_published_page: { type: boolean, default: false }
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, element_id, setting_path]
                    properties:
                      kind: { type: string, enum: [text, color, media, pixfort_icon] }
                      element_id: { type: string, maxLength: 100 }
                      setting_path:
                        type: array
                        minItems: 1
                        maxItems: 30
                        items:
                          anyOf:
                            - { type: string, maxLength: 200 }
                            - { type: integer }
                      expected_value: { type: string }
                      value: { type: string }
                      expected_attachment_id: { type: integer, minimum: 0 }
                      attachment_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: Requested direct edits saved and verified in persisted Elementor data }
        '400': { description: 'Unsupported field or value, or required confirmation missing' }
        '403': { description: Administrator or page-edit permission required }
        '409': { description: Page or target changed after the fresh read }

  /wp-json/elementize/v1/media/images:
    get:
      operationId: searchElementizeMediaImages
      summary: Search existing WordPress images
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: filename, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Matching image attachments }
        '401': { description: Authentication required }
        '403': { description: Media permission required }

  /wp-json/elementize/v1/media/images/import-chat-file:
    post:
      operationId: importElementizeConversationImage
      summary: Import one image supplied in this CustomGPT conversation
      description: Imports or reuses one verified conversation image and returns a WordPress attachment_id that can immediately be used in updateElementizePageContent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [openaiFileIdRefs, confirm_import]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: Exactly one user-supplied image from the current CustomGPT conversation.
                  items: { type: string }
                title: { type: string }
                alt: { type: string }
                confirm_import: { type: boolean, enum: [true] }
      responses:
        '201': { description: Conversation image imported or safely deduplicated and verified }
        '400': { description: 'Invalid image, unsupported format or confirmation missing' }
        '403': { description: Media import permission required }

  /wp-json/elementize/v1/pixfort/icons:
    get:
      operationId: searchElementizePixfortIcons
      summary: Search the installed Pixfort icon library
      description: Returns exact verified Pixfort icon values. Never construct an icon identifier yourself.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: style, in: query, required: false, schema: { type: string, enum: [all, line, duotone, solid], default: all } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Matching installed Pixfort icon values }
        '503': { description: Installed Pixfort icon library could not be indexed }
        '401': { description: Authentication required }
        '403': { description: Page editing permission required }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
