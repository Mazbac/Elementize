name: Frontend build

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Upload WordPress admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: elementize-admin-bundle
          path: |
            assets/admin/elementize-admin.js
            assets/admin/elementize-admin.css
          if-no-files-found: error
      - name: Persist lockfile and WordPress bundle
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json assets/admin/elementize-admin.js assets/admin/elementize-admin.css
          if git diff --cached --quiet; then
            echo "Frontend bundle already matches source."
            exit 0
          fi
          git commit -m "Build Mantine admin bundle"
          git push
