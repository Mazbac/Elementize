name: Frontend build

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce shadcn frontend
        run: |
          set -euo pipefail
          if grep -R -n '@mantine/' src package.json --include='*.ts' --include='*.tsx' --include='package.json'; then
            echo 'Mantine is not allowed in the Elementize frontend.'
            exit 1
          fi
          if grep -R -nE '<(button|textarea|select)\b' src/app src/pages --include='*.tsx'; then
            echo 'Visible controls in app/pages must use shadcn components.'
            exit 1
          fi
          if grep -R -nE '<label\b' src/app src/pages --include='*.tsx'; then
            echo 'Visible labels in app/pages must use the shadcn Label component.'
            exit 1
          fi
          if grep -R -nE '<input\b' src/app src/pages --include='*.tsx' | grep -v 'type="hidden"'; then
            echo 'Visible inputs in app/pages must use the shadcn Input component.'
            exit 1
          fi
          test -f components.json
          test -f src/index.css
          test -d src/components/ui
          test -f src/components/ui/button.tsx
          test -f src/components/ui/card.tsx
          test -f src/components/ui/label.tsx
          test -f src/components/ui/separator.tsx
          test -f src/components/ui/tabs.tsx
          grep -q 'ui.shadcn.com/schema.json' components.json
          grep -q '@tailwindcss/vite' package.json
      - name: Type-check and build
        run: npm run build
      - name: Upload WordPress admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: elementize-admin-bundle
          path: |
            assets/admin/elementize-admin.js
            assets/admin/elementize-admin.css
          if-no-files-found: error
      - name: Persist lockfile and WordPress bundle
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json assets/admin/elementize-admin.js assets/admin/elementize-admin.css
          if git diff --cached --quiet; then
            echo "Frontend bundle already matches source."
            exit 0
          fi
          git commit -m "Build shadcn admin bundle"
          git push
