name: Visual QA contract

on:
  push:
  pull_request:

jobs:
  validate-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate asynchronous capture completion and URL contract
        shell: bash
        run: |
          set -euo pipefail
          runtime="includes/elementize-visual-qa.inc"
          url_test="tests/visual-qa-url-contract.php"
          grep -q "private const VERSION = '5'" "$runtime" || { echo 'Rendered Visual QA v5 is not active.'; exit 1; }
          grep -q "local_chromium_async" "$runtime" || { echo 'Async Chromium backend is missing.'; exit 1; }
          grep -q "png_file_complete" "$runtime" || { echo 'Complete-PNG capture signal is missing.'; exit 1; }
          grep -q "capture_artifact_state" "$runtime" || { echo 'Bounded async capture diagnostics are missing.'; exit 1; }
          grep -q "start \"\" /b" "$runtime" || { echo 'Detached Windows runner launch is missing.'; exit 1; }
          if grep -q "start \"\" /wait" "$runtime"; then
            echo 'Windows capture must not wait for Chromium process exit before recognizing a completed PNG.'
            exit 1
          fi
          grep -q "without a complete PNG" "$runtime" || { echo 'PNG-completion timeout contract is missing.'; exit 1; }
          grep -q "normalize_capture_url" "$runtime" || { echo 'Capture URL normalization is missing.'; exit 1; }
          grep -q "elementize_visual_qa_job_v5_" "$runtime" || { echo 'Visual QA v5 job namespace is missing.'; exit 1; }
          grep -q "capture_url" "$runtime" || { echo 'Fail-closed capture URL stage is missing.'; exit 1; }
          test -f "$url_test" || { echo 'Visual QA URL regression test is missing.'; exit 1; }
          php -l "$runtime"
          php -l "$url_test"
          php "$url_test"
