name: Visual QA contract

on:
  push:
  pull_request:

jobs:
  validate-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate asynchronous capture completion, URL safety and native ChatGPT vision handoff
        shell: bash
        run: |
          set -euo pipefail
          runtime="includes/elementize-visual-qa.inc"
          handoff="includes/elementize-chatgpt-vision.inc"
          url_test="tests/visual-qa-url-contract.php"
          handoff_test="tests/chatgpt-vision-handoff-contract.php"
          timing_test="tests/visual-qa-timing-contract.php"
          quality_test="tests/visual-qa-quality-contract.php"
          grep -q "private const VERSION = '11'" "$runtime" || { echo 'Rendered Visual QA v11 is not active.'; exit 1; }
          grep -q "local_chromium_async" "$runtime" || { echo 'Async Chromium backend is missing.'; exit 1; }
          grep -q "png_file_complete" "$runtime" || { echo 'Complete-PNG capture signal is missing.'; exit 1; }
          grep -q "capture_artifact_state" "$runtime" || { echo 'Bounded async capture diagnostics are missing.'; exit 1; }
          grep -q "Start-Process -FilePath" "$runtime" || { echo 'Proven detached Windows PowerShell launcher is missing.'; exit 1; }
          grep -q "WindowStyle Hidden" "$runtime" || { echo 'Hidden detached Windows launch is missing.'; exit 1; }
          if grep -q "start \"\" /b" "$runtime"; then
            echo 'Legacy cmd start /b launcher must not return.'
            exit 1
          fi
          grep -q "browser runner finished without producing a complete PNG" "$runtime" || { echo 'Completed-runner PNG failure contract is missing.'; exit 1; }
          grep -q "Asynchronous local browser QA exceeded" "$runtime" || { echo 'Bounded asynchronous timeout contract is missing.'; exit 1; }
          grep -q "signed browser diagnostics were not verified" "$runtime" || { echo 'Signed browser-diagnostics failure contract is missing.'; exit 1; }
          grep -q "normalize_capture_url" "$runtime" || { echo 'Capture URL normalization is missing.'; exit 1; }
          grep -q "elementize_visual_qa_job_v11_" "$runtime" || { echo 'Visual QA v11 job namespace is missing.'; exit 1; }
          grep -q "capture_url" "$runtime" || { echo 'Fail-closed capture URL stage is missing.'; exit 1; }
          test -f "$url_test" || { echo 'Visual QA URL regression test is missing.'; exit 1; }
          test -f "$handoff" || { echo 'Native ChatGPT vision handoff runtime is missing.'; exit 1; }
          test -f "$handoff_test" || { echo 'Native ChatGPT vision handoff contract test is missing.'; exit 1; }
          test -f "$timing_test" || { echo 'Visual QA timing regression test is missing.'; exit 1; }
          test -f "$quality_test" || { echo 'Visual QA quality evaluator contract test is missing.'; exit 1; }
          grep -q "quality_gate_evaluation" "$runtime" || { echo 'Deterministic Visual QA gate evaluation is missing.'; exit 1; }
          grep -q "safe_to_autorepair' => false" "$runtime" || { echo 'Repair signals must not authorize automatic writes.'; exit 1; }
          grep -q "openaiFileResponse" "$handoff" || { echo 'GPT Action returned-file handoff is missing.'; exit 1; }
          grep -q "application/zip" "$handoff" || { echo 'Image-safe ZIP handoff is missing.'; exit 1; }
          grep -q "screenshot.png" "$handoff" || { echo 'Native vision screenshot entry is missing.'; exit 1; }
          grep -q "set_param( 'analyze', false )" "$handoff" || { echo 'Native ChatGPT vision must reuse capture-only mode.'; exit 1; }
          php -l "$runtime"
          php -l "$handoff"
          php -l "$url_test"
          php -l "$handoff_test"
          php -l "$timing_test"
          php -l "$quality_test"
          php "$url_test"
          php "$handoff_test"
          php "$timing_test"
          php "$quality_test"
