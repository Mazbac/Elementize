name: Pixfort theme-token contract

on:
  push:
  pull_request:

jobs:
  validate-pixfort-theme-token-selectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate exact installed Pixfort selector writes
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/elementize-pixfort-theme-tokens.inc
          php -l includes/runtime/elementize-pixfort-repeater-colors.inc
          php -l tests/pixfort-theme-token-contract.php
          php -l tests/pixfort-repeater-path-contract.php
          php tests/pixfort-theme-token-contract.php
          php tests/pixfort-repeater-path-contract.php
