name: Creative save diagnostics contract

on:
  push:
  pull_request:

jobs:
  validate-creative-save-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate bounded read-only save-filter diagnostics
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/elementize-creative-save-diagnostics.inc
          php -l tests/creative-save-diagnostics-contract.php
          php tests/creative-save-diagnostics-contract.php
