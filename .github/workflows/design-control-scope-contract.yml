name: Design control scope contract

on:
  push:
  pull_request:

jobs:
  validate-design-control-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php tests/design-control-scope-contract.php
