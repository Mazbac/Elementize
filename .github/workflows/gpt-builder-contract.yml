name: Elementize contract

on:
  push:
  pull_request:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate minimal runtime and GPT contract
        shell: bash
        run: |
          set -euo pipefail
          instructions="config/gpt/wp-builder-instructions.md"
          schema="config/gpt/actions.openapi.yaml"

          expected_runtime=$(cat <<'EOF'
          includes/elementize-activity.inc
          includes/elementize-bootstrap.inc
          includes/elementize-connections.inc
          includes/elementize-content.inc
          includes/elementize-context.inc
          includes/elementize-core.inc
          includes/elementize-media-import.inc
          includes/elementize-media-library.inc
          includes/elementize-onboarding.inc
          includes/elementize-pixfort-icons.inc
          EOF
          )
          actual_runtime=$(find includes -maxdepth 1 -type f -print | sort)
          if [ "$actual_runtime" != "$expected_runtime" ]; then
            echo "Runtime file set changed unexpectedly."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_runtime" "$actual_runtime"
            exit 1
          fi

          require_count=$(grep -c '^require_once __DIR__' includes/elementize-bootstrap.inc || true)
          init_count=$(grep -c '^Elementize_.*::init();$' includes/elementize-bootstrap.inc || true)
          echo "Bootstrap modules: ${require_count} requires / ${init_count} init calls"
          test "$require_count" -eq 9
          test "$init_count" -eq 9

          for module in core pixfort-icons content context media-library media-import activity connections onboarding; do
            grep -q "elementize-${module}.inc" includes/elementize-bootstrap.inc || { echo "Bootstrap missing module: ${module}"; exit 1; }
          done

          grep -q "class Elementize_Context" includes/elementize-context.inc || { echo 'Context resolver runtime class is missing.'; exit 1; }
          grep -q "'/pages/(?P<id>.*)/structure'" includes/elementize-context.inc || { echo 'Semantic structure route is missing.'; exit 1; }
          grep -q "'/pages/(?P<id>.*)/resolve'" includes/elementize-context.inc || { echo 'Natural target resolver route is missing.'; exit 1; }
          grep -q "discover_items" includes/elementize-content.inc || { echo 'Context resolver must use the shared content discovery contract.'; exit 1; }
          grep -q "generic_safe_string" includes/elementize-content.inc || { echo 'Generic safe text discovery is missing.'; exit 1; }
          grep -q "technical_key_pattern" includes/elementize-content.inc || { echo 'Technical text-field fail-closed guard is missing.'; exit 1; }
          php tests/natural-targeting-contract.php

          grep -q "_elementize_sha256" includes/elementize-media-import.inc || { echo 'Media import SHA-256 deduplication is missing.'; exit 1; }
          grep -q "deduplicated" includes/elementize-media-import.inc || { echo 'Media import retry result contract is missing.'; exit 1; }
          grep -q "find_existing_attachment" includes/elementize-media-import.inc || { echo 'Media import idempotency lookup is missing.'; exit 1; }

          grep -q "class Elementize_Activity" includes/elementize-activity.inc || { echo 'Activity runtime class is missing.'; exit 1; }
          grep -q "elementize_undo_activity" includes/elementize-activity.inc || { echo 'Activity undo admin action is missing.'; exit 1; }
          grep -q "class Elementize_Connections" includes/elementize-connections.inc || { echo 'Connection manager runtime class is missing.'; exit 1; }
          grep -q "elementize_revoke_connection" includes/elementize-connections.inc || { echo 'Connection revoke admin action is missing.'; exit 1; }
          grep -q "rest_get_authenticated_app_password" includes/elementize-connections.inc || { echo 'Connection verification must bind to the authenticated Application Password.'; exit 1; }

          instruction_chars=$(wc -m < "$instructions" | tr -d ' ')
          echo "GPT instruction characters: ${instruction_chars}/8000"
          test "$instruction_chars" -le 8000
          grep -qi 'screenshot' "$instructions" || { echo 'Screenshot grounding instructions are missing.'; exit 1; }
          grep -q 'context_element_ids' "$instructions" || { echo 'Conversation context reuse instructions are missing.'; exit 1; }
          grep -q 'after every successful batch' "$instructions" || { echo 'Multi-batch fresh-state instructions are missing.'; exit 1; }
          grep -q 'Unknown result after a mutation' "$instructions" || { echo 'Unknown-mutation recovery instructions are missing.'; exit 1; }
          grep -q '401/403' "$instructions" || { echo 'Authentication failure recovery instructions are missing.'; exit 1; }
          grep -q 'persisted_verification=true' "$instructions" || { echo 'Successful-write completion signal is missing.'; exit 1; }

          operation_count=$(grep -c 'operationId:' "$schema" || true)
          echo "GPT Action operations: ${operation_count}/11"
          test "$operation_count" -eq 11

          required_operations=(
            getElementizeStatus
            listElementizePages
            getElementizePageStructure
            resolveElementizeTargets
            getElementizePageContent
            updateElementizePageContent
            searchElementizeMediaImages
            importElementizeConversationImage
            importElementizeGeneratedImage
            importElementizeRemoteImage
            searchElementizePixfortIcons
          )
          for operation in "${required_operations[@]}"; do
            grep -q "operationId: ${operation}" "$schema" || { echo "Missing operation: ${operation}"; exit 1; }
          done

          forbidden_terms=(
            getElementizePageCompletionAudit
            updateElementizePageDesignSettings
            insertPixfortTemplate
            getPixfortVisualProbe
            createElementorDraft
            aesthetic
            ollama
          )
          for term in "${forbidden_terms[@]}"; do
            if grep -qi "$term" "$schema"; then
              echo "Removed capability still present in GPT schema: $term"
              exit 1
            fi
          done

          grep -q 'url: https://example.invalid' "$schema" || { echo 'Committed schema must keep the neutral placeholder server URL.'; exit 1; }
          grep -q 'openaiFileIdRefs:' "$schema" || { echo 'ChatGPT image file parameter is missing.'; exit 1; }
          grep -q 'import-generated:' "$schema" || { echo 'Generated-image import route is missing.'; exit 1; }
          grep -q 'generated_image_url:' "$schema" || { echo 'Generated-image OpenAI URL fallback is missing.'; exit 1; }
          grep -q 'import-url:' "$schema" || { echo 'Remote-image import route is missing.'; exit 1; }
          grep -q 'pixfort/icons:' "$schema" || { echo 'Pixfort icon search route is missing.'; exit 1; }
          grep -q 'visual_clues:' "$schema" || { echo 'Screenshot clue parameter is missing.'; exit 1; }
          grep -q 'expand:.*group' "$schema" || { echo 'Repeated group expansion contract is missing.'; exit 1; }

          header_version=$(sed -n 's/^ \* Version: //p' elementize.php | head -1)
          constant_version=$(sed -n "s/^define( 'ELEMENTIZE_VERSION', '\([^']*\)' );/\1/p" elementize.php | head -1)
          schema_version=$(sed -n 's/^  version: //p' "$schema" | head -1)
          echo "Versions: header=${header_version} constant=${constant_version} schema=${schema_version}"
          test -n "$header_version"
          test "$header_version" = "$constant_version"
          test "$header_version" = "$schema_version"

          SCHEMA="$schema" ruby <<'RUBY'
          require 'yaml'
          doc = YAML.load_file(ENV.fetch('SCHEMA'))
          violations = []
          walk = nil
          walk = lambda do |node, path|
            if node.is_a?(Hash)
              node.each do |key, value|
                next_path = path + [key.to_s]
                if key.to_s == 'description' && value.is_a?(String) && value.length > 300
                  violations << [next_path.join('.'), value.length]
                end
                walk.call(value, next_path)
              end
            elsif node.is_a?(Array)
              node.each_with_index { |value, index| walk.call(value, path + [index.to_s]) }
            end
          end
          walk.call(doc, [])
          unless violations.empty?
            warn 'OpenAPI descriptions exceed ChatGPT 300-character limit:'
            violations.each { |path, length| warn "#{path}: #{length}" }
            exit 1
          end
          RUBY
