name: ChatGPT vision bounds contract

on:
  push:
  pull_request:

jobs:
  validate-native-vision-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate unified content-bounded native ChatGPT handoff
        shell: bash
        run: |
          set -euo pipefail
          visual="includes/elementize-visual-qa.inc"
          handoff="includes/elementize-chatgpt-vision.inc"
          test_file="tests/chatgpt-vision-bounds-contract.php"
          grep -q "bound_screenshot" "$visual" || { echo 'Unified bounds helper is missing.'; exit 1; }
          grep -q "content_bounded_tall_desktop" "$handoff" || { echo 'Bounded handoff marker is missing.'; exit 1; }
          test ! -f includes/runtime/elementize-chatgpt-vision-bounds.inc || { echo 'Superseded bounds shim returned.'; exit 1; }
          php -l "$visual"
          php -l "$handoff"
          php "$test_file"
